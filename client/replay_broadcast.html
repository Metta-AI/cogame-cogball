/* a team without baked heart art gets a tinted glyph instead (fallback) */
#endcard .ec-heart-glyph {
  color: var(--tc, var(--amber));
  font-size: calc(12 * var(--u));
  line-height: 1;
}
/* loop countdown — present only while the server holds the end segment */
#endcard .ec-replay {
  font-family: var(--finefont);
  font-size: calc(9 * var(--u));
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--paper-dim);
  min-height: calc(12 * var(--u));
}
#endcard .ec-replay b { color: var(--paper); font-variant-numeric: tabular-nums; }

/* connection status — fine print, lower-left */
#status {
  position: absolute;
  left: calc(10 * var(--u));
  bottom: calc(62 * var(--u));
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ghost);
  /* above the locker-room curtain (25): connection state stays readable
     while the pre-load scene is up */
  z-index: 26;
  pointer-events: none;
  opacity: 0;
  transition: opacity 200ms;
}
#status.show { opacity: 1; }

/* ============================================================
   PRE-LOAD CURTAIN — THE BOT LOCKER ROOM
   The wasm/replay boot can take seconds; instead of a dark board
   captioned "Warming up", the stage opens on the backstage room
   UNDER the arena: the four cogs prepping their paintball markers
   in a lamp-lit locker room. The scene is nanobanana-generated
   art (art/lockerroom/ — same warm Ink & Print world as the
   dungeon wall textures): ONE static empty-room plate (bg.jpg)
   with five alpha-sprite poses per cog (<bot>_<pose>.webp)
   layered on top and cycled per bot (see .lk-art below).
   Dismissed by the first ingested frame (dismissLockerRoom).
   Sits UNDER #status (fine-print
   connection state stays readable) and #mmwarn; shown in embed
   mode too — it IS the League Replayer's lit floor while loading.
   ============================================================ */
#lockerroom {
  position: absolute;
  inset: 0;
  z-index: 25;
  overflow: hidden;
  font-family: var(--pixfont);
  background: radial-gradient(120% 95% at 50% 30%, var(--stage-hi) 0%, var(--stage-lo) 55%, #100b07 100%);
  opacity: 1;
  transition: opacity 600ms ease;
}
#lockerroom.gone { opacity: 0; pointer-events: none; }

/* hanging-lamp light: an amber pool over the room + a low bounce off the
   floor, with the occasional basement-fixture flicker */
#lockerroom .lk-glow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(46% 60% at 50% 28%, rgba(232, 163, 61, 0.15), transparent 70%),
    radial-gradient(62% 26% at 50% 88%, rgba(232, 163, 61, 0.08), transparent 75%);
  animation: lk-flicker 9s linear infinite;
}
@keyframes lk-flicker {
  0%, 86%, 90%, 95%, 100% { opacity: 1; }
  88% { opacity: 0.78; }
  93% { opacity: 0.9; }
}

/* The scene: ONE static background plate (bg.jpg — the empty room) with
   the four cogs layered on top as freestanding alpha sprites, five
   generated poses each. Every bot runs its own pose carousel (distinct
   cycle length + phase, crossfaded windows) over its own idle sway, so
   the composed scene never repeats for minutes — smooth continuous
   animation over a rock-solid background. A soft radial mask melts the
   plate's edges into the stage gradient, and the whole scene breathes
   on a slow zoom. */
#lockerroom .lk-art {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: lk-breathe 14s ease-in-out infinite alternate;
}
@keyframes lk-breathe { from { transform: scale(1); } to { transform: scale(1.03); } }
#lockerroom .lk-bg {
  display: block;
  max-width: 94%;
  max-height: 96%;
  -webkit-mask-image: radial-gradient(ellipse 74% 80% at 50% 48%, #000 50%, transparent 99%);
  mask-image: radial-gradient(ellipse 74% 80% at 50% 48%, #000 50%, transparent 99%);
}
/* sprite plane, fitted to the bg image's box by fitLockerSprites() */
#lockerroom .lk-sprites { position: absolute; }
/* one wrapper per bot (anchored over its floor spot, carries the idle
   sway), its pose sprites stacked bottom-center inside */
#lockerroom .lk-boto { position: absolute; transform-origin: 50% 100%; }
#lockerroom .lk-boto img {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  opacity: 0;
  animation: lk-pose var(--cyc, 4s) linear infinite;
}
/* each pose owns a crossfaded 1/5 window of its bot's cycle (delay-shifted) */
@keyframes lk-pose {
  0% { opacity: 0; }
  4% { opacity: 1; }
  20% { opacity: 1; }
  24% { opacity: 0; }
  100% { opacity: 0; }
}
/* idle sway per seat: subtle, distinct tempi so the row never metronomes */
@keyframes lk-sway { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-1.5px) rotate(0.6deg); } }
#lockerroom .lk-boto:nth-child(1) { animation: lk-sway 3.4s ease-in-out infinite; }
#lockerroom .lk-boto:nth-child(2) { animation: lk-sway 2.9s ease-in-out -1.2s infinite; }
#lockerroom .lk-boto:nth-child(3) { animation: lk-sway 3.8s ease-in-out -0.6s infinite; }
#lockerroom .lk-boto:nth-child(4) { animation: lk-sway 3.1s ease-in-out -2s infinite; }

/* rotating prep-talk line + amber scan bar + fine print, over the floor */
#lockerroom .lk-cap {
  position: absolute;
  bottom: 13%;
  left: 0; right: 0;
  text-align: center;
  font-family: var(--finefont);
  font-size: calc(11 * var(--u));
  color: var(--paper-dim);
  text-shadow: 0 1px 0 rgba(10, 7, 4, 0.8), 0 0 calc(8 * var(--u)) rgba(10, 7, 4, 0.9);
  transition: opacity 150ms;
}
#lockerroom .lk-cap.swap { opacity: 0; }
#lockerroom .lk-bar {
  position: absolute;
  bottom: 10.2%;
  left: 50%;
  transform: translateX(-50%);
  width: calc(150 * var(--u));
  height: calc(3 * var(--u));
  background: rgba(242, 232, 216, 0.12);
  border-radius: calc(2 * var(--u));
  overflow: hidden;
}
#lockerroom .lk-bar i {
  position: absolute;
  top: 0; bottom: 0;
  left: -34%;
  width: 34%;
  border-radius: calc(2 * var(--u));
  background: linear-gradient(90deg, transparent, var(--amber), transparent);
  animation: lk-scan 1.6s ease-in-out infinite alternate;
}
@keyframes lk-scan { from { left: -34%; } to { left: 100%; } }
#lockerroom .lk-sub {
  position: absolute;
  bottom: 6.4%;
  left: 0; right: 0;
  text-align: center;
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ghost);
  text-shadow: 0 1px 0 rgba(10, 7, 4, 0.9);
}

@media (prefers-reduced-motion: reduce) {
  #lockerroom * { animation: none !important; }
  /* with the carousels stopped, hold each bot's rest pose over the plate */
  #lockerroom .lk-boto img:first-child { opacity: 1; }
}

/* ============================================================
   The replay is ONE fixed-aspect composition (relayout() sizes #stage to the
   board's 1235:659 aspect inside the embed box), so there is no portrait/reflow
   case: at every container shape the board and its overlays scale together as a
   single unit and stay pinned. The only responsive lever is chrome DENSITY —
   `.tiny` eases the reserves so the 640×360 floor stays legible.
   ============================================================ */
/* very small floor (≤640px stage): tighten reserves */
#stage.tiny #killfeed { min-height: calc(3 * 20 * var(--u)); width: calc(190 * var(--u)); }
#stage.tiny .plate .squad-pip { width: calc(6 * var(--u)); height: calc(6 * var(--u)); }

@media (prefers-reduced-motion: reduce) {
  #grain, .clock.amb { animation: none; }
  .plate.leader .lives-num { animation: none; }
  .banner-chip, .feed-row { animation-duration: 1ms; }
}

/* ============================================================
   EMBED MODE — inside the League Replayer shell (?embed=1)
   The shell owns the walls + team headers + KDA + standings + transport, drawn
   from the postMessage frame stream. Here we show the board (the lit pit floor)
   PLUS the designed broadcast feedback layer that belongs over the play area —
   the kill feed and the flag-event banner lane (lower-third / center wipes).
   We hide only the chrome the shell re-draws (scorebug/transport) and the
   ambient light-pool/grain/status, and let the board fill the embed box.
   ============================================================ */
body[data-embed] #scorebug,
body[data-embed] #transport,
body[data-embed] #lightpool,
body[data-embed] #grain,
body[data-embed] #status { display: none !important; }
body[data-embed] #board { top: 0; height: 100%; }

/* Opt-OUT of the #viewpanel overlay (zoom bar + minimap) by param only:
   ?viewpanel=0 sets body[data-noviewpanel]. Defaults are unchanged everywhere
   — the League Replayer shell loads the board with ?embed=1 and KEEPS zoom +
   minimap (that's why #271 blanket-hiding the panel in all embeds was reverted
   in #272). Only surfaces that explicitly ask — billboards (Lobby hero) and
   thumbnail capture — append &viewpanel=0 to drop the panel. Independent of
   embed: the two params don't touch each other. */
body[data-noviewpanel] #viewpanel { display: none !important; }
</style>
</head>
<body>
<div id="viewport">
<div id="stage">
  <canvas id="board"></canvas>
  <div id="lightpool"></div>
  <div id="grain" class="amb"></div>

  <!-- Pre-load curtain: the bot locker room. The six art frames (srcs set by
       buildLockerRoom — the path prefix is delivery-mode dependent) play as a
       ~4fps idle loop; the whole scene fades out on the first ingested
       frame (dismissLockerRoom). role=status so screen readers hear one
       "Loading replay" while the visual squad preps their markers. -->
  <div id="lockerroom" role="status" aria-label="Loading replay">
    <div class="lk-art" id="lk-art" aria-hidden="true">
      <img class="lk-bg" id="lk-bg" alt="">
      <div class="lk-sprites" id="lk-sprites"></div>
    </div>
    <div class="lk-glow" aria-hidden="true"></div>
    <div class="lk-cap" id="lk-cap" aria-hidden="true">Filling hoppers with fresh paint&hellip;</div>
    <div class="lk-bar" aria-hidden="true"><i></i></div>
    <div class="lk-sub">Bot locker room &middot; Loading replay</div>
  </div>

  <div id="chrome">
    <!-- Plates are generated per active team (2-4) by ensureScorebug(): one
         per side for classic red/blue, two stacked per side for 3-4 teams.
         Each plate holds a flag icon, one inline NAME · Lives · count row
         (mirrored on the right so names flank the clock), and the squad pip
         strip (one pip per player: alive / down / eliminated; clickable →
         POV lens). -->
    <div id="scorebug">
      <div class="plates" id="plates-l"></div>

      <div class="clock-col">
        <div class="clock amb" id="clock">
          <div class="time" id="clock-time">0:00</div>
          <span class="ffwd-mini" id="ffwd-mini">▸▸</span>
          <div class="caption" id="clock-caption">In the locker room</div>
        </div>
      </div>

      <div class="plates" id="plates-r"></div>
    </div>

    <!-- View controls: zoom the board with buttons/slider/keys/pinch (never a
         plain scroll — that belongs to the page), and once zoomed, a minimap
         with a white view box says which part of the board you are holding.
         Click or drag the minimap to jump the view there. -->
    <div id="viewpanel">
      <div id="minimap" title="Click or drag to move the view">
        <canvas id="minimap-canvas"></canvas>
        <span class="mm-cap">View</span>
      </div>
      <div id="zoombar" role="group" aria-label="Board zoom">
        <button class="zbtn" id="zoom-out" title="Zoom out (x)" aria-label="Zoom out">&minus;</button>
        <input id="zoom-slider" type="range" min="0" max="1000" step="1" value="0"
               aria-label="Board zoom" aria-valuetext="Fitted">
        <button class="zbtn" id="zoom-in" title="Zoom in (z)" aria-label="Zoom in">+</button>
        <span id="zoom-read" aria-live="off">FIT</span>
      </div>
    </div>

    <div id="mmwarn">Replay hash mismatch — showing recorded inputs</div>
    <div id="povBadge">👁 POV lens — click to clear</div>
    <!-- First-person picture-in-picture: the selected seat's Wolfenstein-style
         raycast view, shown only while a player is in POV. A window into what
         that soldier sees down the barrel, riding alongside their top-down fog.
         Its own inset tactical map (bottom-left) shows the seat's position and
         vision cone against the WHOLE un-fogged arena, so the viewer always
         knows where the EYES are looking and standing. -->
    <div id="fpv">
      <canvas id="fpv-canvas"></canvas>
      <!-- Self-status HUD: this soldier's hp pips, lives, carried gear. -->
      <div class="fpv-hud" id="fpv-hud">
        <span class="fpv-name" id="fpv-name"></span>
        <span class="fpv-hp" id="fpv-hp"></span>
        <span class="fpv-gear" id="fpv-gear"></span>
      </div>
      <!-- Un-fogged tactical minimap: arena walls + all units + hearts + the
           POV seat's vision wedge. Full context, no fog of war. -->
      <div class="fpv-map" id="fpv-map">
        <canvas id="fpv-map-canvas"></canvas>
      </div>
      <div class="fpv-cap" id="fpv-cap">EYES</div>
      <!-- corner grip: drag to resize (bottom-right so it clears the screen edge
           when the PiP is pinned bottom-left) -->
      <div class="fpv-grip" id="fpv-grip" title="Drag to resize"></div>
    </div>
    <div id="bannerlane"></div>
    <div id="killfeed"></div>

    <div id="transport">
      <!-- Buttons on top, scrubber/timeline below (the transport sits in its own
           reserved band under the board, so nothing here overlaps play). -->
      <div class="tbar">
        <button class="tbtn" id="btn-restart" title="Restart (,)">⟲</button>
        <button class="tbtn" id="btn-back" title="Back one tick (b)">◂|</button>
        <button class="tbtn" id="btn-play" title="Play / pause (space)">▶</button>
        <button class="tbtn" id="btn-fwd" title="Skip +5s (.)">+5s</button>
        <button class="tbtn" id="btn-end" title="Jump to end (e)">|▸</button>
        <button class="tbtn" id="btn-loop" title="Loop (r)">↻</button>
        <button class="tbtn" id="btn-skip" title="Auto-skip lulls (f)">▸▸</button>
        <button class="tbtn" id="btn-spoilers" title="Spoilers: kills / flag story / winner on the timeline ahead of the playhead (o)">spoilers</button>
        <span class="ffwd-chip" id="ffwd-chip">▸▸ SKIPPING LULL</span>
        <span class="win-chip" id="win-chip"></span>
        <span class="tick-clock" id="tick-clock">0 / 0</span>
        <span class="tsep"></span>
        <div class="speedchips" id="speedchips"></div>
      </div>
      <div class="scrub" id="scrub">
        <!-- momentum graph sits UNDERNEATH the seek track, on the SAME tick/mx
             axis, so the playhead crosses it 1:1 with the timeline -->
        <svg class="momentum" id="momentum" viewBox="0 0 1000 100"
             preserveAspectRatio="none" aria-hidden="true"></svg>
        <span class="momentum-label">GOAL LEAD</span>
        <div class="scrub-track"></div>
        <div class="scrub-fill" id="scrub-fill"></div>
        <!-- lull shading rides ABOVE track+fill so the quiet stretches read
             dimmed whether played or not; the amber head still wins (z:3) -->
        <div id="lulls"></div>
        <div class="scrub-win" id="scrub-win"></div>
        <div class="scrub-head" id="scrub-head"></div>
      </div>
    </div>

    <div id="endcard">
      <div class="headline" id="ec-headline">—</div>
      <div class="wincond" id="ec-wincond"></div>
      <div class="how" id="ec-how"></div>
      <!-- One stats panel per active team, generated by ensureEndcardTeams(). -->
      <div class="ec-teams" id="ec-teams"></div>
      <div class="ec-replay" id="ec-replay"></div>
    </div>
  </div>

  <div id="status">connecting</div>
</div>
</div>

<!-- WIRE_CONSTANTS -->
<!-- CHROME_COMMON -->
<!-- BROADCAST_CORE -->

<script>
(function () {
  'use strict';

  // Shared replay chrome (chrome_common.js, spliced over the CHROME_COMMON
  // marker by the server / dist bundle; the literal marker must not appear
  // inside this script or the splice would corrupt it). A raw file:// open of
  // this source has no splice — same non-functional baseline as the missing
  // BROADCAST_CORE — so fail loud and early instead of throwing mid-file.
  if (!window.ChromeCommon) {
    console.error('replay_broadcast: chrome_common.js missing — this page must be served spliced (native server or dist bundle), not opened raw.');
    return;
  }
  var C = window.ChromeCommon({
    send: function (cmd) { send(cmd); },
    // Beat markers seek on click (chrome_common.markBeat builds buttons).
    seek: function (tick) { send('s:' + tick); },
    sendPov: function (slot) { send('v:' + slot); },
    getState: function () { return lastState; }
  });
  // Aliases so the per-view code below reads exactly as before.
  var RED = C.RED, BLUE = C.BLUE, AMBER = C.AMBER, PAPER = C.PAPER;
  var GREEN = C.GREEN, YELLOW = C.YELLOW;
  var TEAM_ORDER = C.TEAM_ORDER, TEAM_COLOR = C.TEAM_COLOR;
  var teamCol = C.teamCol, activeTeams = C.activeTeams, teamOf = C.teamOf;
  var otherTeam = C.otherTeam, stripSeatSuffix = C.stripSeatSuffix;
  var teamPolicies = C.teamPolicies, teamName = C.teamName, teamHeadline = C.teamHeadline;
  var rosterName = C.rosterName, setName = C.setName, esc = C.esc, fmt = C.fmt;
  var togglePov = C.togglePov, renderClock = C.renderClock, renderTransport = C.renderTransport;
  var ingestLullSpans = C.ingestLullSpans, renderLullSpans = C.renderLullSpans;
  var markBeat = C.markBeat, renderBeatMarkers = C.renderBeatMarkers;
  var ingestBeats = C.ingestBeats, setVerdict = C.setVerdict;
  var ingestLeadSeries = C.ingestLeadSeries, recordMomentum = C.recordMomentum;
  var renderMomentum = C.renderMomentum;
  var getSpoilers = C.getSpoilers, setSpoilers = C.setSpoilers;

  // Cogball draws no first-person billboards: soccer is a perfect-information
  // sport, so there is no fog, no vision cone and no EYES inset to feed.
  // Engine-authoritative wire constants (read via the shared chrome; the
  // fallback literals for raw file:// opens live in chrome_common.js).
  var WIRE = C.WIRE, SPEEDS = C.SPEEDS, FPS = C.FPS;

  // Two independent tempo levers (§11, L20):
  //  (1) ANIM_MAX_FACTOR — chrome beat animations never play faster than this
  //      no matter the replay speed, so feed rows / flips / banners keep their
  //      read time at 8-16×. Applied as an animationFactor cap on durations.
  //  (2) DWELL_FLOOR_MS — a beat's on-screen hold has a wall-clock minimum
  //      (feed row / banner / curtain), collapsing only the dead time between
  //      contacts. These are NOT one speed knob — one caps motion, one floors dwell.
  var ANIM_MAX_FACTOR = 2;
  var DWELL_FLOOR_MS = { feed: 2600, banner: 1900, curtain: 2400, read: 600 };
  function animFactor() {
    // Lever 1 — the chrome plays at min(replaySpeed, cap): at 16× the board flies
    // but a kill row still slides in at 2×-equivalent so a human can read it.
    var sp = (lastState && lastState.sp) || 1;
    return Math.min(sp, ANIM_MAX_FACTOR);
  }
  function dwellFloor(kind) {
    // Lever 2 — a beat's on-screen hold has a wall-clock minimum regardless of
    // replay speed; speed collapses only the dead time between contacts, never
    // the read time of a beat itself. Independent of the animFactor cap.
    return DWELL_FLOOR_MS[kind] || DWELL_FLOOR_MS.read;
  }
  // Beat-pause (§11): freeze chrome ambient the instant a beat lands so idle
  // life never competes with a kill/steal/capture. Held for the READ_PAUSE floor
  // (≥600ms wall-clock), then released. The board's own 24Hz is never touched.
  var beatPulseTimer = null;
  function beatPulse() {
    stage.classList.add('beat-active');
    if (beatPulseTimer) clearTimeout(beatPulseTimer);
    beatPulseTimer = setTimeout(function () {
      stage.classList.remove('beat-active');
      beatPulseTimer = null;
    }, dwellFloor('read'));
  }

  var $ = C.$;
  var viewport = $('viewport');
  var stage = $('stage');
  var canvas = $('board');
  var statusEl = $('status');

  // ---- where this page's own art lives -------------------------------------
  // COG_BASE, not a root-absolute "/client/…": this page is served from THREE
  // places and a leading slash is only correct at one of them.
  //  - native server, bare:      the board's own client route → "" + /client/…
  //  - native server, proxied:   the same route behind a Kubernetes service
  //    proxy, /<prefix>/client/… — a leading slash would drop <prefix> and 404.
  //  - the STATIC WASM BUNDLE:   /v2/coworlds/replays/static/<coworld>/<hash>/
  //    index.html, where the art sits NEXT TO the page and there is no server
  //    at all — a leading slash resolves to the API origin root and 404s.
  // Stripping the trailing "/client/<page>" recovers the prefix, so the same
  // expression serves all three. Mirrors ART_BASE in league_replayer.html and
  // websocketPathForClientPage() in broadcast_core.js, which map the same
  // /client + /clients route pair the same way. The bundle is detected by its
  // WASM adapter rather than a URL param: window.CogballStaticReplay only
  // exists when static_replay.js is on the page.
  var COG_BASE = window.CogballStaticReplay
    ? '.'
    : location.pathname.replace(/\/clients?\/[^/]*$/, '') + '/client';

  // ---- pre-load curtain: the bot locker room -------------------------------
  // The stage opens on this scene (see #lockerroom CSS) while the socket /
  // wasm sim boots. The art frames are wired here (their base path is
  // delivery-mode dependent, like the cog art); the first ingested frame
  // calls dismissLockerRoom(), which fades the room out after a short
  // minimum dwell (a sub-second load would otherwise flash the scene like
  // a glitch).
  var lockerEl = $('lockerroom');
  var LOCKER_MIN_DWELL_MS = 900;
  var lockerShownAt = Date.now();
  var lockerCapTimer = null, lockerGone = false;
  (function buildLockerRoom() {
    // Scene art (nanobanana generations, like the shell's dungeon walls):
    // bg.jpg is the empty-room plate; each bot is five freestanding alpha
    // sprites (<bot>_<pose>.webp) cut from the generated pose frames. The
    // base hangs off COG_BASE (above): native "<prefix>/client" +
    // "/art/lockerroom", static bundle "./art/lockerroom".
    var artBase = COG_BASE + '/art/lockerroom';
    $('lk-bg').src = artBase + '/bg.jpg';

    // Sprite geometry baked by the extraction script (scripts prompt in the
    // PR): ax/ay anchor each bot's bottom-center on the plate, w/h size each
    // pose — all in % of the 992x926 plate, so everything scales together.
    // Distinct cycle lengths keep the four carousels out of phase; the
    // composed scene state repeats only every few minutes.
    var LK_BOTS = {
      blue:   { ax: 35.00, ay: 76.67, cyc: 3.8,
        poses: [{ f: 1, w: 16.63, h: 18.25 }, { f: 2, w: 14.92, h: 21.6 },
                { f: 3, w: 15.83, h: 21.81 }, { f: 5, w: 16.63, h: 20.63 },
                { f: 6, w: 14.62, h: 22.68 }] },
      red:    { ax: 68.00, ay: 77.43, cyc: 4.1,
        poses: [{ f: 1, w: 18.15, h: 18.79 }, { f: 2, w: 15.93, h: 20.19 },
                { f: 3, w: 15.52, h: 19.87 }, { f: 5, w: 15.83, h: 20.63 },
                { f: 6, w: 16.73, h: 21.06 }] }
    };
    var spritesEl = $('lk-sprites');
    // Cogball ships exactly two liveries: the Azure and Crimson rigs.
    ['blue', 'red'].forEach(function (bot) {
      var b = LK_BOTS[bot];
      var maxW = 0, maxH = 0;
      b.poses.forEach(function (p) {
        maxW = Math.max(maxW, p.w);
        maxH = Math.max(maxH, p.h);
      });
      var wrap = document.createElement('div');
      wrap.className = 'lk-boto';
      wrap.style.left = (b.ax - maxW / 2) + '%';
      wrap.style.top = (b.ay - maxH) + '%';
      wrap.style.width = maxW + '%';
      wrap.style.height = maxH + '%';
      b.poses.forEach(function (p, ix) {
        var img = document.createElement('img');
        img.alt = '';
        img.src = artBase + '/' + bot + '_' + p.f + '.webp';
        // widths are % of the plate; inside the wrapper they rescale by maxW
        img.style.width = (p.w / maxW * 100) + '%';
        img.style.setProperty('--cyc', b.cyc + 's');
        img.style.animationDelay = (ix * b.cyc / b.poses.length) + 's';
        wrap.appendChild(img);
      });
      spritesEl.appendChild(wrap);
    });

    // Pin the sprite plane to the bg image's on-screen box (the img is the
    // flex-fitted sizer; % geometry above resolves against this plane).
    var bgImg = $('lk-bg');
    function fitLockerSprites() {
      spritesEl.style.left = bgImg.offsetLeft + 'px';
      spritesEl.style.top = bgImg.offsetTop + 'px';
      spritesEl.style.width = bgImg.offsetWidth + 'px';
      spritesEl.style.height = bgImg.offsetHeight + 'px';
    }
    bgImg.addEventListener('load', fitLockerSprites);
    if (window.ResizeObserver) new ResizeObserver(fitLockerSprites).observe(bgImg);
    window.addEventListener('resize', fitLockerSprites);
    fitLockerSprites();

    // rotating prep-talk line under the scene
    var lines = [
      'Filling hoppers with fresh paint…',
      'Pump check: one, two. One, two…',
      'Polishing visors to a mirror shine…',
      'Shaking the paint pods awake…',
      'Squats. Even robots warm up…',
      'Topping off the CO₂…',
      'Chalking up the wheels…',
      'Reviewing the game plan…'
    ];
    var capEl = $('lk-cap'), capIx = 0;
    lockerCapTimer = setInterval(function () {
      capEl.classList.add('swap');
      setTimeout(function () {
        capIx = (capIx + 1) % lines.length;
        capEl.textContent = lines[capIx];
        capEl.classList.remove('swap');
      }, 180);
    }, 2600);
  })();
  function dismissLockerRoom() {
    if (lockerGone) return;
    lockerGone = true;
    var wait = Math.max(0, LOCKER_MIN_DWELL_MS - (Date.now() - lockerShownAt));
    setTimeout(function () {
      lockerEl.classList.add('gone');
      setTimeout(function () {
        lockerEl.style.display = 'none';
        if (lockerCapTimer) { clearInterval(lockerCapTimer); lockerCapTimer = null; }
      }, 650);
    }, wait);
  }

  // ---- embed mode (League Replayer) ----------------------------------------
  // When loaded inside the League Replayer shell (?embed=1), this client renders
  // ONLY the board (its own scorebug/transport/feed chrome is hidden by CSS via
  // body[data-embed]) and streams each parsed state frame up to the parent shell
  // over postMessage. The shell owns the walls + scorebug + KDA + standings and
  // draws them from this stream, so there is ONE websocket / ONE transport /
  // perfect tick-sync between the embedded game and the wall HUD.
  var EMBED = false;
  try { EMBED = new URLSearchParams(location.search).get('embed') === '1'; } catch (e) {}
  if (EMBED) document.body.setAttribute('data-embed', '1');

  // ?viewpanel=0 hides the #viewpanel overlay (zoom bar + minimap). This is an
  // explicit opt-OUT only — the default (param absent) is unchanged for every
  // existing embed, so the League Replayer still shows zoom + minimap. See the
  // #271/#272 lesson: hiding the panel for ALL embeds broke the Replayer shell.
  // Billboards (Lobby hero) and thumbnail capture append &viewpanel=0.
  try {
    if (new URLSearchParams(location.search).get('viewpanel') === '0')
      document.body.setAttribute('data-noviewpanel', '1');
  } catch (e) {}

  // Tick deep-link (?t=<tick>): seek there on load, paused, via the same s:
  // command the scrubber uses (the sim clamps out-of-range ticks). One-shot,
  // fired on the first ingested frame so the replay runtime is ready.
  var SEEK_T = null;
  try {
    var seekRaw = new URLSearchParams(location.search).get('t');
    if (seekRaw != null && /^\d+$/.test(seekRaw)) SEEK_T = parseInt(seekRaw, 10);
  } catch (e) {}
  function postToShell(type, payload) {
    if (!EMBED || window.parent === window) return;
    try { window.parent.postMessage({ src: 'ctf-replay', type: type, data: payload }, '*'); } catch (e) {}
  }

  // The whole replay is ONE fixed-aspect composition locked to the board's
  // native size. The stage is sized to this aspect inside the embed box and
  // every overlay scales with it, so the chrome can never drift off the
  // graphics regardless of the Observatory container's shape
  // (§2 real-container-target, L82 bounded-embed).
  //
  // These are PRE-STREAM DEFAULTS ONLY (the classic arena's 1235×659). The game
  // serves many map shapes — a four-team board is SQUARE (2496² / 4992²) — so
  // the real native size arrives on every frame and syncBoardAspect re-layouts
  // the stage when it differs. Leaving them hard-coded pillarboxes a square
  // board inside a 1.874:1 stage with dead bands either side.
  var BOARD_W = 1100, BOARD_H = 625;
  var BOARD_ASPECT = BOARD_W / BOARD_H;
  function syncBoardAspect(s) {
    if (!s || !(s.boardW > 1) || !(s.boardH > 1)) return;
    var aspect = s.boardW / s.boardH;
    if (Math.abs(aspect - BOARD_ASPECT) < 0.001) return;
    BOARD_W = s.boardW; BOARD_H = s.boardH; BOARD_ASPECT = aspect;
    relayout();
  }

  // (the livery chip is a plain CSS swatch; cogball has no flag)
  // ---- core (board renderer + WS) ----
  var lastState = null;
  var replayAdapter = window.CogballStaticReplay || null;
  var coreConfig = {
    canvas: canvas,
    onText: function (txt) { onFrame(txt); },
    onStatus: function (st) { onStatus(st); },
    onFirstFrame: function () { core.setViewportFit(); syncViewUi(); },
    // The core owns the view, so it tells the controls where it ended up —
    // never the other way round. That keeps the slider honest when the zoom
    // moved for some other reason (a pinch, an arrow key, a refit, a new board).
    onTransform: function (t) { syncViewUi(t); }
  };
  var core = replayAdapter
    ? replayAdapter.createCore(coreConfig)
    : window.BroadcastCore.create(coreConfig);

  // Tell the League Replayer shell the board is alive and showing its
  // locker-room curtain, so the shell can drop its own "loading replay…"
  // toast (which would float mid-scene) and give a slow wasm boot a longer
  // leash before escalating to the load-failure card.
  postToShell('boot');

  function send(cmd) { core.sendCommand(cmd); }

  // Transport commands relayed DOWN from the League Replayer shell (embed mode):
  // the shell's wall-mounted transport buttons/scrubber postMessage a command
  // string, which we forward to the single shared replay websocket. Same command
  // vocabulary the local transport uses, so the shell drives playback 1:1.
  if (EMBED) {
    window.addEventListener('message', function (ev) {
      var m = ev.data;
      if (!m || m.src !== 'cogball-shell') return;
      if (m.type === 'cmd' && typeof m.cmd === 'string') send(m.cmd);
      else if (m.type === 'seek' && m.tick != null) send('s:' + m.tick);
      else if (m.type === 'pov' && m.slot != null) send('v:' + m.slot);
    });
  }

  function onStatus(st) {
    statusEl.textContent = st;
    statusEl.classList.toggle('show', st !== 'open');
  }

  // ============================================================
  //  Frame ingest
  // ============================================================
  var lastTick = -1;
  var lastFf = false;   // previous frame's fast-forward flag (jump detection)
  // (beat markers, lull spans, beats timeline and momentum state live in the
  // shared chrome closure — see chrome_common.js)

  function onFrame(txt) {
    var s;
    try { s = JSON.parse(txt); } catch (e) { return; }
    lastState = s;
    dismissLockerRoom();  // the board is live — fade the pre-load curtain

    if (SEEK_T != null) { send('s:' + SEEK_T); SEEK_T = null; }

    // The board's real native size, read off the core's letterbox transform.
    // THIS page re-layouts its own stage to it (syncBoardAspect) and it also
    // rides along to the League Replayer shell (embed mode), which reads
    // roster/KDA, clock, lives, flags and pov straight off this frame to paint
    // the wall-mounted scorebug + KDA tables in lockstep with the board — and
    // tracks the same aspect with its own syncBoardAspect.
    if (core) {
      var bt = core.getTransform();
      if (bt.nativeW > 1 && bt.nativeH > 1) { s.boardW = bt.nativeW; s.boardH = bt.nativeH; }
    }
    syncBoardAspect(s);
    postToShell('frame', s);

    // Detect a jump (seek/loop): clear transient beats so nothing phantoms.
    // A skip-lulls fast-forward frame legitimately advances up to 64 ticks
    // (this frame or the previous one, which may have crossed OUT of the
    // lull), so widen the expected stride accordingly instead of misreading
    // the boost as a seek.
    var stride = (s.ff || lastFf) ? Math.min((s.sp || 1) * 8, 64) : (s.sp || 1);
    var jumped = (s.t < lastTick) || (lastTick >= 0 && s.t - lastTick > stride * 4 + 2);
    if (jumped) { clearFeed(); clearBanners(); }
    lastFf = !!s.ff;

    renderScorebug(s);
    renderClock(s);
    renderTransport(s);
    renderMismatch(s);

    if (s.events && s.events.length && !jumped) {
      for (var i = 0; i < s.events.length; i++) applyEvent(s.events[i], s);
    }
    renderCoachFeed(s, jumped);
    // Even on a jump, register beat markers we can place from state? Markers
    // come from events only; on a jump the tracker resync'd (no events), so we
    // keep whatever markers we already collected.
    ingestLeadSeries(s);
    ingestLullSpans(s);
    ingestBeats(s);
    recordMomentum(s);

    if (s.ph === 'gameover') { renderEndcard(s); if (s.over) setVerdict(s.over); }
    else { $('endcard').classList.remove('on'); }

    lastTick = s.t;
  }

  // (ingestLeadSeries / ingestLullSpans / ingestBeats / setVerdict live in the
  // shared chrome — chrome_common.js)

  // The server ships the static minimap wall silhouette ONCE (RLE of a coarse
  // floor/stone/glass grid). Decode it into an offscreen canvas keyed to the
  // arena, so the tactical map blits terrain in one drawImage per frame instead
  // of re-rasterizing the grid. Cached for the whole match.
  // ---------- scorebug ----------
  // Cogball's plate is the soccer scorebug: the policy name, the GOALS
  // numeral, and two small figures (possession %, shots). The `.squad` strip
  // becomes the three robot chips — AZ-1..3 / CR-1..3, the anonymous in-game
  // identities — tinted by their own paint hue so a spectator can tie a chip
  // to the trail it leaves on the turf. Real policy names appear on the plate
  // and nowhere else: the board labels and the coach's view carry only the
  // aliases.
  var ROBOT_HUES = { azure: [190, 202, 214], crimson: [348, 0, 12] };
  function robotIdsOf(team) {
    var prefix = team === 'azure' ? 'AZ' : 'CR';
    return [prefix + '-1', prefix + '-2', prefix + '-3'];
  }
  function renderSquad(el, s, team) {
    var ids = robotIdsOf(team);
    if (el._key !== team) {
      el.innerHTML = '';
      el._chips = {};
      ids.forEach(function (id, i) {
        var chip = document.createElement('span');
        chip.className = 'squad-pip';
        chip.title = id;
        chip.style.setProperty('--fill', '1');
        chip.style.background =
          'hsl(' + ROBOT_HUES[team][i] + ' 58% 52%)';
        el.appendChild(chip);
        el._chips[id] = chip;
      });
      el._key = team;
    }
  }

  // Rebuild the scorebug plates when the active team set changes (once per
  // match in practice). Plates alternate sides in TEAM_ORDER — index 0 left,
  // 1 right — so both team names stay innermost, flanking the clock.
  var sbTeams = null;
  function ensureScorebug(teams) {
    var key = teams.join(',');
    if (sbTeams === key) return;
    sbTeams = key;

  function renderScorebug(s) {
    var teams = activeTeams(s);

    teams.forEach(function (team) {
      goals[team] = (tr[team] && tr[team].goals) || 0;

  function shortName(n) {
    n = String(n || '');
    var at = n.indexOf('@'); if (at > 0) n = n.slice(0, at);
    if (n.length > 10) n = n.slice(0, 10);

  // (clock, transport and lull shading live in the shared chrome —
  // chrome_common.js: fmt / renderClock / renderTransport / renderLullSpans)

  // ---------- integrity ----------
  function renderMismatch(s) {
    $('mmwarn').classList.toggle('on', s.mm >= 0);

  // ---------- instant slow-mo goal replay ----------
  // Goals are BEATS, so the chrome already knows every goal tick up front.
  // On first reaching one, the transport pauses half a second, seeks back
  // three seconds, replays them at the slowest step behind a GOAL REPLAY
  // banner and a vignette, then seeks forward to the goal tick and restores
  // the speed. Built purely out of the existing seek/speed commands
  // (applyReplayCommand server-side), one replay per goal, and any manual
  // scrub cancels it.
  var GOAL_REPLAY_BACK = 72;         // ticks (3 s at 24 Hz)
  var SPEED_CMD = { 1: '1', 2: '2', 3: '3', 4: '4', 8: '8', 16: '6' };
  var goalReplaySeen = {};
  var goalReplayTimers = [];
  var goalReplayActive = false;
  function cancelGoalReplay() {
    goalReplayTimers.forEach(clearTimeout);
    goalReplayTimers = [];
    if (goalReplayActive) {
      goalReplayActive = false;
      stage.classList.remove('goal-replay');
    }
  }
  function runGoalReplay(tick, s) {
    if (goalReplaySeen[tick] || !s.en || goalReplayActive) return;
    goalReplaySeen[tick] = true;
    goalReplayActive = true;
    var restore = SPEED_CMD[s.sp] || '1';
    var back = Math.max((s.st || 0), tick - GOAL_REPLAY_BACK);
    stage.classList.add('goal-replay');
    send('P');
    goalReplayTimers.push(setTimeout(function () {
      send('s:' + back);
      send('1');
      banner('GOAL REPLAY', 'goal');
      send('p');
    }, 500));
    goalReplayTimers.push(setTimeout(function () {
      send('s:' + tick);
      send(restore);
      send('p');
      stage.classList.remove('goal-replay');
      goalReplayActive = false;
      goalReplayTimers = [];
    }, 500 + (GOAL_REPLAY_BACK * 1000 / 24)));
  }

  function renderMismatch(s) {
    $('mmwarn').classList.toggle('on', s.mm >= 0);
  }

  // ============================================================
  //  Beats → surfaces  (§5)
  // ============================================================
  function applyEvent(e, s) {
    switch (e.k) {
      case 'goal': onGoal(e, s); break;
      case 'shot': onShot(e, s); break;
      case 'save': onSave(e, s); break;
      case 'pass': onPass(e, s); break;
      case 'interception': onInterception(e, s); break;
      case 'drop': onDrop(e, s); break;
      case 'kickoff': break;
      case 'gameover': setVerdict(e); break;
      default: break;
    }
  }

  function teamChip(team, text) {
    return '<span class="k-name ' + team + '">' + esc(text) + '</span>';
  }

  function onGoal(e, s) {
    markBeat(e.t, 'goal', e.team,
      'GOAL ' + (e.team || '').toUpperCase() + ' \u2014 ' + (e.by || '?') +
      (e.score ? ' (' + e.score[0] + '\u2013' + e.score[1] + ')' : ''));
    var speed = e.speed ? (' \u00b7 ' + e.speed.toFixed(1) + ' m/s') : '';
    var assist = e.assist ? (' (assist ' + esc(e.assist) + ')') : '';
    pushFeed('<span class="k-verb">GOAL</span> ' +
      teamChip(e.team, e.team.toUpperCase()) + ' \u2014 ' +
      esc(e.by || '?') + assist + speed);
    banner('GOAL ' + e.team.toUpperCase() + '  ' +
      (e.score ? e.score[0] + '\u2013' + e.score[1] : ''), e.team);
    beatPulse();
    runGoalReplay(e.t, s);
  }
  function onShot(e, s) {
    if (!e.onTarget) return;
    pushFeed(teamChip(e.team, e.team.toUpperCase()) +
      ' <span class="k-verb">shoots</span> \u2014 on target');
  }
  function onSave(e, s) {
    markBeat(e.t, 'save', e.team,
      'SAVE ' + (e.team || '').toUpperCase() + ' \u2014 ' + (e.by || '?'));
    pushFeed(teamChip(e.team, e.team.toUpperCase()) +
      ' <span class="k-verb">SAVE</span>');

  }
  function onPass(e, s) {
    pushFeed(teamChip(e.team, e.team.toUpperCase()) +
      ' <span class="k-verb">pass completed</span>');
  }
  function onInterception(e, s) {
    pushFeed(teamChip(e.team, e.team.toUpperCase()) +
      ' <span class="k-verb">intercepts</span>');
  }
  function onDrop(e, s) {
    markBeat(e.t, 'drop', '');
    pushFeed('<span class="k-verb">neutral drop</span> \u2014 the ball was going nowhere');
  }

  // The coach channel: directive notes and robot chatter, folded out of the
  // replay's own chat records by the sim (broadcast.applyRecord) so a live
  // broadcast and a replay say exactly the same thing. This is where a
  // spectator SEES the LLM playing.
  var feedSeen = 0;
  function renderCoachFeed(s, jumped) {
    var rows = s.feed || [];
    if (jumped || rows.length < feedSeen) feedSeen = rows.length;
    for (var i = feedSeen; i < rows.length; i++) {
      var row = rows[i];
      if (row.k === 'note' || row.k === 'say' || row.k === 'fallback') {
        pushFeed('<span class="k-name ' + (row.team || '') + '">' +
          esc(row.text) + '</span>');
      }
    }
    feedSeen = rows.length;
  }

  // ---------- kill feed queue (fixed reserve, dwell floor) ----------
  var feedEl = $('killfeed');
  var MAX_FEED = 4;
  // Callers hand over the row's HTML (a team chip plus a verb, or a coach
  // note); the row ELEMENT is built here, so one place owns the .feed-row
  // class and the animation contract below.
  function pushFeed(html) {
    var row = document.createElement('div');
    row.className = 'feed-row';
    row.innerHTML = html;
    feedEl.insertBefore(row, feedEl.firstChild);
    while (feedEl.children.length > MAX_FEED) feedEl.removeChild(feedEl.lastChild);
    // Dwell floor (lever 2): a wall-clock minimum so the row reads even at 16×.
    var hold = dwellFloor('feed');
    // animFactor cap (lever 1): the slide-in duration never dips below its
    // read-time, so the row still overshoots-and-settles legibly at high speed.
    row.style.animationDuration = (250 / animFactor()) + 'ms';
    setTimeout(function () {
      if (row.parentNode) { row.classList.add('leaving'); setTimeout(function () { if (row.parentNode) row.parentNode.removeChild(row); }, 300); }
    }, hold);
  }
  function clearFeed() { feedEl.innerHTML = ''; }

  // ---------- banner lane queue (one at a time, min hold) ----------
  var bannerEl = $('bannerlane');
  var bannerQueue = [];
  var bannerBusy = false;
  function banner(text, cls) {
    bannerQueue.push({ text: text, cls: cls });
    pumpBanner();
  }
  function pumpBanner() {
    if (bannerBusy || !bannerQueue.length) return;
    bannerBusy = true;
    var b = bannerQueue.shift();
    var chip = document.createElement('div');
    chip.className = 'banner-chip ' + b.cls;
    chip.textContent = b.text;
    bannerEl.appendChild(chip);
    // lever 1 (animFactor cap): the pop-in never plays faster than 2x, so a
    // fast-forward scrub can't reduce a banner to a subliminal flash.
    chip.style.animationDuration = (300 / animFactor()) + 'ms';
    var hold = dwellFloor('banner'); // lever 2: wall-clock dwell floor (~1.9s)
    setTimeout(function () {
      chip.classList.add('leaving');
      setTimeout(function () {
        if (chip.parentNode) chip.parentNode.removeChild(chip);
        bannerBusy = false;
        pumpBanner();
      }, 260);
    }, hold);
  }
  function clearBanners() {
    bannerQueue = [];
    bannerEl.innerHTML = '';
    bannerBusy = false;
  }

  // ============================================================

  var ecTeams = null;
  function ensureEndcardTeams(teams) {

    ecTeams = key;

    }[o.endRule] || o.endRule || '';

        '<div class="ec-row"><span>goals</span><b>' + (t.goals || 0) + '</b></div>' +

        '<div class="ec-row"><span>score</span><b>' +

  // ============================================================
  //  Transport wiring — DOM controls emit the legacy chat chars +
  //  the ctf-side s:/v: whole-string commands.
  // ============================================================
  function togglePlay() { send(' '); }
  // (speed chips + their speed→command map live in the shared chrome)
  $('btn-play').addEventListener('click', togglePlay);
  $('btn-restart').addEventListener('click', function () { send(','); });
  $('btn-back').addEventListener('click', function () { send('b'); });
  $('btn-fwd').addEventListener('click', function () { send('.'); });
  $('btn-end').addEventListener('click', function () { send('e'); });
  $('btn-loop').addEventListener('click', function () { send('r'); });
  $('btn-skip').addEventListener('click', function () { send('f'); });

  // click-to-seek: map x-fraction to a tick and send s:<tick>
  $('scrub').addEventListener('click', function (ev) {
    if (!lastState || !lastState.en) return;
    var rect = this.getBoundingClientRect();
    var frac = Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
    // Map the click back onto the shown [startTick, maxTick] axis.
    var st = Math.max(0, lastState.st || 0);
    var mx = Math.max(st + 1, lastState.mx || 1);
    var tick = st + Math.round(frac * (mx - st));
    send('s:' + tick);
  });

  // pov clear (togglePov lives in the shared chrome, driven via ctx.sendPov)
  $('povBadge').addEventListener('click', function () { send('v:-1'); });

  // keyboard shortcuts mirror the transport
  window.addEventListener('keydown', function (ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var k = ev.key;
    if (k === ' ') { ev.preventDefault(); togglePlay(); }
    else if (k === ',' || k === '<') send(',');
    else if (k === '.' || k === '>') send('.');
    else if (k === 'b') send('b');
    else if (k === 'e') send('e');
    else if (k === 'r') send('r');
    else if (k === 'f') send('f');
    else if (k === '+' || k === '=') send('+');
    else if (k === '-' || k === '_') send('-');
    else if (k === 'o') setSpoilers(!getSpoilers());
    // Board zoom rides z/x/0: +/- and 1..9 are already the server's speed
    // commands, so they can't double as view keys.
    else if (k === 'z') core.zoomAt(ZOOM_STEP);
    else if (k === 'x') core.zoomAt(1 / ZOOM_STEP);
    else if (k === '0') core.resetView();
    // Arrows walk the view one CELL at a time; with shift, ten cells. A cell is
    // a fixed distance in the WORLD — the same ground on every map and at every
    // zoom — so arrowing is a way of stepping across the arena, not a nudge
    // whose size depends on how far in you happen to be.
    else if (k === 'ArrowLeft' || k === 'ArrowRight' ||
             k === 'ArrowUp' || k === 'ArrowDown') {
      var vt = core.getTransform();
      if (!vt || !(vt.zoom > 1)) return;   // fitted whole: nowhere to go
      ev.preventDefault();
      var step = panCellBoardPx() * (ev.shiftKey ? 10 : 1);
      var stepX = (k === 'ArrowLeft' ? -1 : k === 'ArrowRight' ? 1 : 0);
      var stepY = (k === 'ArrowUp' ? -1 : k === 'ArrowDown' ? 1 : 0);
      core.panByMap(stepX * step, stepY * step);
    }
    else if (k >= '1' && k <= '9') send(k);
    // keydown never crosses the iframe boundary: relay Esc to the league
    // shell, which relays it on to the Observatory theater host.
    else if (k === 'Escape') postToShell('esc');
  });

  // Click a soldier on the board to select it (mirrors the squad-pip lens, but
  // for anyone visible on the arena). The board canvas draws ONLY the zoomable
  // map layer, letterboxed by broadcast_core; chrome (scoreboard, transport) are
  // HTML overlays, so a canvas click is always a MAP-space click. Invert the
  // core's letterbox transform to recover native map pixels, then hand them to
  // clickMap — the server hit-tests the soldier footprint and toggles selection.
  // ---- zoom + pan -------------------------------------------------------
  // A generated board can be 4992px square; letterboxed whole into a ~760px
  // stage that is 0.15x, where a cog is a single pixel. So the board has to be
  // enterable — but NOT by scrolling. A trackpad two-finger scroll and a mouse
  // wheel are how you move the PAGE, and a viewer that eats them zooms the
  // board every time someone tries to scroll past it. The gestures that mean
  // "zoom" and nothing else are: pinch (trackpad and touchscreen), the +/-
  // buttons and slider, and the z/x keys. Drag pans, arrows nudge, double-click
  // (or 0, or the slider at rest) refits.
  // The transform lives in broadcast_core, so click-to-select below inverts the
  // SAME numbers and keeps hitting what you actually clicked at any zoom.
  var dragging = false, dragMoved = 0, lastDragX = 0, lastDragY = 0;
  function canvasPoint(ev) {
    var rect = canvas.getBoundingClientRect();
    return { x: ev.clientX - rect.left, y: ev.clientY - rect.top, ok: rect.width > 0 };
  }

  // A trackpad PINCH reaches a browser as a wheel event with ctrlKey set (no
  // ctrl key is actually held) — that, and only that, is the wheel we take.
  // Everything else falls through to the page exactly as if the board were an
  // image. preventDefault on this one also suppresses the browser's own
  // ctrl+wheel page zoom, which would otherwise fight the board zoom.
  var gesturing = false, gestureZoom = 1, gestureAt = null;
  canvas.addEventListener('wheel', function (ev) {
    if (!ev.ctrlKey || gesturing) return;
    ev.preventDefault();
    var p = canvasPoint(ev);
    if (!p.ok) return;
    var unit = ev.deltaMode === 1 ? 16 : (ev.deltaMode === 2 ? 100 : 1);
    core.zoomAt(Math.exp(-ev.deltaY * unit * 0.012), p.x, p.y);
  }, { passive: false });

  // Safari reports the same trackpad pinch as gesture events instead, with an
  // absolute scale factor from the gesture's start; `gesturing` keeps the two
  // paths from both firing on browsers that send both.
  canvas.addEventListener('gesturestart', function (ev) {
    ev.preventDefault();
    gesturing = true;
    var t = core.getTransform();
    gestureZoom = (t && t.zoom) || 1;
    gestureAt = canvasPoint(ev);
  });
  canvas.addEventListener('gesturechange', function (ev) {
    ev.preventDefault();
    if (!gesturing || !(ev.scale > 0)) return;
    var a = gestureAt && gestureAt.ok ? gestureAt : null;
    core.setZoom(gestureZoom * ev.scale, a ? a.x : undefined, a ? a.y : undefined);
  });
  canvas.addEventListener('gestureend', function (ev) {
    ev.preventDefault();
    gesturing = false;
  });

  // Touchscreen pinch. #board's touch-action leaves one-finger panning to the
  // page while it is fitted (so the board never traps a scroll) and takes it
  // back once zoomed in, where a drag has somewhere to go; pinch-zoom is never
  // in that list, so a second finger always arrives here as a pointer.
  var pinch = new Map();          // pointerId -> {x, y}
  var pinchSpan = 0, pinchMidX = 0, pinchMidY = 0;
  function pinchGeometry() {
    var pts = Array.from(pinch.values());
    var dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
    return {
      span: Math.max(1, Math.hypot(dx, dy)),
      midX: (pts[0].x + pts[1].x) / 2,
      midY: (pts[0].y + pts[1].y) / 2
    };
  }
  function beginPinch() {
    var g = pinchGeometry();
    pinchSpan = g.span;
    pinchMidX = g.midX;
    pinchMidY = g.midY;
    dragging = false;             // two fingers is a pinch, not a drag
  }

  function syncTouchAction(t) {
    // Fitted: the page owns one-finger drags. Zoomed: the board does.
    canvas.style.touchAction = (t && t.zoom > 1) ? 'none' : 'pan-x pan-y';
  }

  canvas.addEventListener('pointerdown', function (ev) {
    if (ev.pointerType === 'touch') {
      pinch.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pinch.size === 2) { beginPinch(); return; }
      if (pinch.size > 2) return;
    }
    if (ev.button !== 0) return;
    dragging = true;
    dragMoved = 0;
    lastDragX = ev.clientX;
    lastDragY = ev.clientY;
  });
  window.addEventListener('pointermove', function (ev) {
    if (pinch.has(ev.pointerId)) {
      pinch.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pinch.size === 2) {
        var g = pinchGeometry();
        var rect = canvas.getBoundingClientRect();
        // Zoom by how much the fingers spread, then pan by how far the pair
        // travelled, so the board tracks the hand instead of only the spread.
        core.zoomAt(g.span / pinchSpan, g.midX - rect.left, g.midY - rect.top);
        core.panBy(g.midX - pinchMidX, g.midY - pinchMidY);
        pinchSpan = g.span;
        pinchMidX = g.midX;
        pinchMidY = g.midY;
        dragMoved = 999;          // a pinch must never also select a cog
        return;
      }
    }
    if (!dragging) return;
    var dx = ev.clientX - lastDragX, dy = ev.clientY - lastDragY;
    lastDragX = ev.clientX;
    lastDragY = ev.clientY;
    dragMoved += Math.abs(dx) + Math.abs(dy);
    core.panBy(dx, dy);
    var t = core.getTransform();
    canvas.style.cursor = t && t.zoom > 1 ? 'grabbing' : '';
  });
  function endPointer(ev) {
    if (ev && pinch.has(ev.pointerId)) {
      pinch.delete(ev.pointerId);
      if (pinch.size === 2) beginPinch();
    }
    dragging = false;
    canvas.style.cursor = '';
  }
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);

  // ---- view controls: zoom cluster + minimap ----------------------------
  var ZOOM_STEP = 1.35;     // one button press / one z or x key
  var SLIDER_TRAVEL = 1000;
  // One arrow press, in LOGICAL map pixels — a fixed cell of ground. 64px is
  // eight of the engine's fog-of-war cells (FovCellSize) and a bit over five
  // cog widths: ~19 cells across the 1235px arena, ~39 across a 2496px 4-team
  // board, so shift (ten cells) crosses either in a couple of presses while a
  // single press is still a step you can aim with.
  var PAN_CELL_MAP_PX = 64;

  // The view is measured in BOARD pixels and a cell is defined in WORLD pixels,
  // and the two differ by the board's supersample factor — which is per-board
  // (an oversize map renders 1x, a normal one at RenderScale), so the server
  // states it per frame as `bs`. Falling back to 1 makes an un-stated board
  // step a cell of board pixels: smaller ground per press, never a broken key.
  function panCellBoardPx() {
    var bs = lastState && lastState.bs > 0 ? lastState.bs : 1;
    return PAN_CELL_MAP_PX * bs;
  }
  var minimapBox = $('minimap');
  var zoomSlider = $('zoom-slider');
  var zoomRead = $('zoom-read');
  var btnZoomIn = $('zoom-in');
  var btnZoomOut = $('zoom-out');
  var sliderHeld = false;
  var lastMiniAspect = '';

  function sliderToZoom(travel, t) {
    var lo = (t && t.minZoom) || 1, hi = (t && t.maxZoom) || 12;
    return lo * Math.pow(hi / lo, travel / SLIDER_TRAVEL);
  }
  function zoomToSlider(z, t) {
    var lo = (t && t.minZoom) || 1, hi = (t && t.maxZoom) || 12;
    if (!(z > lo)) return 0;
    return Math.round(SLIDER_TRAVEL * Math.log(z / lo) / Math.log(hi / lo));
  }

  // One place where the whole view UI is re-read off the core's transform: the
  // slider, the readout, the button enable states, the minimap's shape and
  // whether it is up at all. Every input path (buttons, slider, keys, pinch,
  // drag, minimap, refit) lands here through onTransform, so no control can
  // drift out of step with the board.
  function syncViewUi(t) {
    t = t || core.getTransform();
    if (!t || !zoomSlider) return;   // a transform can land before the wiring
    var z = t.zoom || 1, lo = t.minZoom || 1, hi = t.maxZoom || 12;
    var zoomed = z > lo + 1e-6;
    if (!sliderHeld) zoomSlider.value = String(zoomToSlider(z, t));
    zoomSlider.setAttribute('aria-valuetext', zoomed ? z.toFixed(1) + 'x board zoom' : 'Fitted');
    zoomRead.textContent = zoomed ? z.toFixed(1) + '×' : 'FIT';
    zoomRead.classList.toggle('zoomed', zoomed);
    btnZoomIn.disabled = z >= hi - 1e-6;
    btnZoomOut.disabled = !zoomed;
    // The minimap is the answer to "which part am I holding" — a question that
    // only exists once part of the board is off-screen.
    minimapBox.classList.toggle('on', zoomed);
    if (t.nativeW > 0 && t.nativeH > 0) {
      var aspect = t.nativeW + ' / ' + t.nativeH;
      if (aspect !== lastMiniAspect) {
        // A four-team board is square; a fixed 1.874:1 inset would squash it.
        minimapBox.style.aspectRatio = aspect;
        lastMiniAspect = aspect;
      }
    }
    syncTouchAction(t);
    if (!dragging) canvas.style.cursor = zoomed ? 'grab' : '';
  }

  core.attachMinimap($('minimap-canvas'));

  btnZoomIn.addEventListener('click', function () { core.zoomAt(ZOOM_STEP); });
  btnZoomOut.addEventListener('click', function () { core.zoomAt(1 / ZOOM_STEP); });
  zoomSlider.addEventListener('pointerdown', function () { sliderHeld = true; });
  window.addEventListener('pointerup', function () { sliderHeld = false; });
  zoomSlider.addEventListener('input', function () {
    var t = core.getTransform();
    var next = sliderToZoom(Number(zoomSlider.value) || 0, t);
    // The slider has no cursor to zoom toward, so it grows out of the middle of
    // what you are already looking at — the focus point stays put.
    core.setZoom(next);
  });
  // The slider owns the keyboard while focused (arrows step the zoom, not the
  // pan) — otherwise a focused slider and the board would both answer.
  zoomSlider.addEventListener('keydown', function (ev) { ev.stopPropagation(); });

  // Click or drag the minimap to send the view there: with a colossal board the
  // fastest way across it is to point at the destination, not to pan to it.
  var miniDragging = false;
  function minimapSeek(ev) {
    var rect = minimapBox.getBoundingClientRect();
    var t = core.getTransform();
    if (!rect.width || !rect.height || !t || !(t.nativeW > 0)) return;
    var fx = (ev.clientX - rect.left) / rect.width;
    var fy = (ev.clientY - rect.top) / rect.height;
    core.panTo(Math.min(1, Math.max(0, fx)) * t.nativeW,
               Math.min(1, Math.max(0, fy)) * t.nativeH);
  }
  minimapBox.addEventListener('pointerdown', function (ev) {
    ev.preventDefault();
    ev.stopPropagation();
    miniDragging = true;
    // Capture is a convenience (drag past the frame keeps steering); it throws
    // if the pointer is already gone, and that must not cost us the jump.
    try {
      if (minimapBox.setPointerCapture) minimapBox.setPointerCapture(ev.pointerId);
    } catch (err) { /* no active pointer: the click still seeks */ }
    minimapSeek(ev);
  });
  minimapBox.addEventListener('pointermove', function (ev) {
    if (miniDragging) minimapSeek(ev);
  });
  minimapBox.addEventListener('pointerup', function () { miniDragging = false; });
  minimapBox.addEventListener('pointercancel', function () { miniDragging = false; });
  canvas.addEventListener('dblclick', function (ev) {
    ev.preventDefault();
    core.resetView();
  });

  canvas.addEventListener('click', function (ev) {
    // A pan is not a click: dragging the board must never also select the cog
    // that happened to be under the pointer when the drag ended.
    if (dragMoved > 4) { dragMoved = 0; return; }
    var rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    // getBoundingClientRect is CSS px; the core's transform lives in the same
    // CSS space (offsetX/offsetY/scale are computed against clientWidth/Height,
    // NOT the dpr-scaled backing store), so no devicePixelRatio factor here.
    var cssX = ev.clientX - rect.left;
    var cssY = ev.clientY - rect.top;
    var t = core.getTransform();
    if (!t || !t.scale) return;
    var mapX = Math.round((cssX - t.offsetX) / t.scale);
    var mapY = Math.round((cssY - t.offsetY) / t.scale);
    // Ignore clicks in the letterbox bands (outside the drawn map).
    if (mapX < 0 || mapY < 0 || mapX >= t.nativeW || mapY >= t.nativeH) return;
    core.clickMap(mapX, mapY);
  });

  // ============================================================
  //  Fixed-aspect fit: size the composition to the board's native aspect
  //  inside the embed box, then scale the whole thing (board + overlays) as
  //  one unit. Chrome sizes off the STAGE width, so overlays stay locked to
  //  the graphics at any container shape (§2, L82 bounded-embed).
  // ============================================================
  function relayout() {
    var boxW = viewport.clientWidth, boxH = viewport.clientHeight;
    if (!boxW || !boxH) return;
    // The board region (game action) fits the board aspect into the box BETWEEN a
    // reserved top band (the scorebug) and bottom band (the transport), so neither
    // ever sits over play. Each band's pixel height depends on --hudscale (→ board
    // width) and the board fit depends on the bands, so iterate to a FIXED POINT:
    // stop as soon as a pass measures the same bands it was laid out with. Two
    // passes settle a container resize, but a MAP-ASPECT change (the 1.874:1
    // arena → a square four-team board) swings --hudscale far enough that the
    // second pass is still reserving the old bands, which would leave the board
    // a couple of percent off its true aspect — visible as thin dead strips.
    var scorebug = document.getElementById('scorebug');
    var transport = document.getElementById('transport');
    var root = document.documentElement;
    var topBand = parseFloat(getComputedStyle(root).getPropertyValue('--topband')) || 0;
    var band = parseFloat(getComputedStyle(root).getPropertyValue('--band')) || 0;
    var stageW = 0, stageH = 0;
    for (var pass = 0; pass < 4; pass++) {
      var prevTop = topBand, prevBand = band;
      var availH = Math.max(1, boxH - topBand - band);
      var boardW, boardH;
      if (boxW / availH > BOARD_ASPECT) {
        boardH = availH; boardW = Math.round(availH * BOARD_ASPECT);
      } else {
        boardW = boxW; boardH = Math.round(boxW / BOARD_ASPECT);
      }
      stageW = boardW; stageH = boardH + topBand + band;
      stage.style.width = stageW + 'px';
      stage.style.height = stageH + 'px';
      // One scale for the whole composition: chrome was authored against a
      // ~760px-wide reference board, so --hudscale is the board's on-screen width
      // over that reference (clamped so a huge featured embed doesn't bloat the
      // chrome and a tiny 360px floor stays legible).
      var scale = Math.max(0.5, Math.min(1.6, boardW / 760));
      root.style.setProperty('--hudscale', scale.toFixed(3));
      // The 640x360 embed floor: at or under 640 CSS px of board the plates
      // drop their possession/shots stats and read "name goals - goals name".
      stage.classList.toggle('tiny', boardW <= 640);
      // Measure each band's natural height → reserve exactly that.
      topBand = scorebug ? scorebug.offsetHeight : 0;
      band = transport ? transport.offsetHeight : 0;
      root.style.setProperty('--topband', topBand + 'px');
      root.style.setProperty('--band', band + 'px');
      if (Math.abs(topBand - prevTop) < 0.5 && Math.abs(band - prevBand) < 0.5) break;
    }
    core.setViewportFit();
  }
  var ro = new ResizeObserver(relayout);
  ro.observe(viewport);
  window.addEventListener('resize', relayout);

  relayout();
  core.start();
})();
</script>
</body>
</html>
